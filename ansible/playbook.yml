---
- name: Harden Ubuntu EC2 workload
  hosts: all
  become: true
  gather_facts: true
  vars:
    hardening_disable_ssh: false
    hardening_confirm_ssm_access: false
  pre_tasks:
    - name: Require Ubuntu OS
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
        fail_msg: "This baseline currently supports Ubuntu only."
  roles:
    - base-hardening
