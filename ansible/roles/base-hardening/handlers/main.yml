---
- name: restart journald
  ansible.builtin.service:
    name: systemd-journald
    state: restarted

- name: reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: reload ssh
  ansible.builtin.service:
    name: ssh
    state: reloaded
  when:
    - not hardening_disable_ssh | bool
    - "'ssh.service' in ansible_facts.services"
