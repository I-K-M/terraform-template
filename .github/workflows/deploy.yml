name: AWS plan (manual, approved)
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        options: [dev, prod]
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: aws-terraform-${{ github.event.inputs.environment }}
  cancel-in-progress: false
jobs:
  plan:
    # A manual dispatch from an unreviewed branch must never obtain AWS OIDC credentials.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.13.5"
      - name: AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: eu-west-3
          role-session-name: github-terraform
      - name: Assert expected AWS account
        env:
          EXPECTED_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_ACCOUNT"
          test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_ACCOUNT"
      - name: Init backend
        env:
          STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
          STATE_KMS_KEY_ARN: ${{ vars.TERRAFORM_STATE_KMS_KEY_ARN }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          set -euo pipefail
          test -n "$STATE_BUCKET"
          test -n "$STATE_KMS_KEY_ARN"
          terraform init -input=false -backend-config="bucket=$STATE_BUCKET" -backend-config="key=terraform-template/$ENVIRONMENT/terraform.tfstate" -backend-config="region=eu-west-3" -backend-config="kms_key_id=$STATE_KMS_KEY_ARN"
      - name: Terraform plan (no apply)
        env:
          TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
          TF_VAR_environment: ${{ github.event.inputs.environment }}
        run: terraform plan -input=false -no-color
